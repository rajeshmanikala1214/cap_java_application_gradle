# ---------------------------------------------------------------------------
# Versions carried over 1:1 from the original Maven build (root pom.xml).
# Do not bump these as part of the build-tool migration.
# ---------------------------------------------------------------------------
group=my
version=1.0.0-SNAPSHOT

javaVersion=21
springBootVersion=3.5.14
cdsServicesVersion=4.9.0
cloudSdkVersion=5.30.0
xsuaaVersion=3.7.3
cfJavaLoggingSupportVersion=4.2.0
cdsFeatureAttachmentsVersion=1.5.0
jacocoVersion=0.8.12

# ---------------------------------------------------------------------------
# Gradle-only plugin versions. These have NO counterpart in pom.xml, so they
# could not be derived from the Maven build. See MIGRATION.md -> "Unverified".
# ---------------------------------------------------------------------------
springDependencyManagementVersion=1.1.7
spotlessVersion=8.6.0

# ---------------------------------------------------------------------------
# Node.js used to run @sap/cds-dk. Replaces the cds-maven-plugin
# "install-node" goal. Use -PuseSystemNode=true to use the node/npm already
# on PATH instead of downloading a local one.
# ---------------------------------------------------------------------------
nodeVersion=22.14.0
nodeDistBaseUrl=https://nodejs.org/dist

# ---------------------------------------------------------------------------
# cds:generate equivalent. Filled in by cdsGenerate's auto-discovery when the
# generator jar exposes a conventional entry point; set explicitly to pin it.
# Run ./gradlew cdsCodegenInspect to print what the jar actually offers.
#   cdsCodegenMainClass=<fully.qualified.Main>
#   cdsCodegenArgs=<space separated args, see MIGRATION.md>
# ---------------------------------------------------------------------------

# The CDS build tasks write into shared directories at the repository root,
# so subprojects must not run them concurrently.
org.gradle.parallel=false
org.gradle.caching=true
