# ---------------------------------------------------------------------------
# Versions carried over 1:1 from the original Maven build (root pom.xml).
# Do not bump these as part of the build-tool migration.
# ---------------------------------------------------------------------------
group=my
version=1.0.0-SNAPSHOT

javaVersion=21
springBootVersion=3.5.14
cdsServicesVersion=4.9.0
cloudSdkVersion=5.30.0
xsuaaVersion=3.7.3
cfJavaLoggingSupportVersion=4.2.0
cdsFeatureAttachmentsVersion=1.5.0
jacocoVersion=0.8.12

# ---------------------------------------------------------------------------
# Gradle-only plugin versions. These have NO counterpart in pom.xml, so they
# could not be derived from the Maven build. See MIGRATION.md -> "Unverified".
# ---------------------------------------------------------------------------
springDependencyManagementVersion=1.1.7
# Spotless publishes its Maven and Gradle plugins on separate version lines from
# the same release cycle: maven 3.x.y pairs with gradle 8.x.y (latest today are
# maven/3.10.1 and gradle/8.10.1). pom.xml used spotless-maven-plugin 3.6.0, so
# the matching Gradle line is 8.6.0 - same release, same google-java-format
# default, no formatting drift.
spotlessVersion=8.6.0

# ---------------------------------------------------------------------------
# Node.js used to run @sap/cds-dk. Replaces the cds-maven-plugin
# "install-node" goal. Use -PuseSystemNode=true to use the node/npm already
# on PATH instead of downloading a local one.
# ---------------------------------------------------------------------------
# installNode uses the node/npm already on PATH when it satisfies
# nodeMinimumMajor, and downloads a private Node otherwise. @sap/cds 9.9.1
# declares engines.node >=20. Force either path with -PuseSystemNode=true|false.
nodeVersion=22.14.0
nodeMinimumMajor=20
nodeDistBaseUrl=https://nodejs.org/dist

# ---------------------------------------------------------------------------
# cds:generate equivalent. cds4j-codegen has no CLI, so gradle/codegen-driver
# drives its API directly; the four options the POM configured
# (basePackage=cds.gen, strictSetters, interfacesForAspects, linkedInterfaces)
# live in codegenSettings inside gradle/cds.gradle. Run
# ./gradlew :srv:cdsCodegenInspect to dump the generator's resolved API.
# ---------------------------------------------------------------------------

# The CDS build tasks write into shared directories at the repository root,
# so subprojects must not run them concurrently.
org.gradle.parallel=false
org.gradle.caching=true
