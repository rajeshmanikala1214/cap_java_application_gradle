// ===========================================================================
// spotless-maven-plugin 3.6.0 equivalent.
//
// Maven configuration was:
//   <java><googleJavaFormat><style>GOOGLE</style></googleJavaFormat></java>
//   <pom><includes>pom.xml</includes><sortPom/></pom>
//   bound to the process-sources phase with goal "check"
//
// The <pom>/sortPom half is dropped because there is no longer a pom.xml.
// GOOGLE is google-java-format's default style, so it needs no explicit setting.
//
// The plugin id is made available by settings.gradle (pluginManagement.plugins,
// which supplies the version) plus `id 'com.diffplug.spotless' apply false` in
// the root build.gradle, which puts it on the root buildscript classpath that
// subprojects inherit. An earlier revision used a buildscript {} block in this
// script instead; that adds the jar to THIS script's classloader only, while
// `apply plugin: '<id>'` resolves ids against the target project's classpath, so
// it failed with "Plugin with id 'com.diffplug.spotless' not found".
// ===========================================================================

apply plugin: 'com.diffplug.spotless'

spotless {
    java {
        // Scoped to hand-written sources only. Maven's default java target was
        // ${basedir}/src/main/java and src/test/java, so the generated
        // cds.gen.* sources were never format-checked; keeping that scope
        // matters because generated code is not google-java-format clean.
        target fileTree(projectDir) {
            include 'src/main/java/**/*.java'
            include 'src/test/java/**/*.java'
        }
        googleJavaFormat()
    }
}

// Maven bound spotless:check to process-sources, i.e. before compilation.
// The Gradle plugin wires spotlessCheck into `check` by default, which still
// makes `gradle build` fail on a formatting violation, just later in the run.